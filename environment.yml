name: student-feedback
channels:
  - pytorch
  - nvidia       # <--- Bắt buộc phải có để tải pytorch-cuda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - mkl=2023.1.0
  - libblas=*=*mkl

  # PyTorch cho GPU
  - pytorch>=2.2.0
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio
  # Đã xóa 'cpuonly' ở đây

  - pandas>=2.0.0
  - numpy>=1.24.0
  - pyyaml>=6.0
  - scikit-learn>=1.4.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  - pip
  - pip:
      - gdown>=4.7.0
      - datasets>=2.14.0
      - wandb>=0.17.0