name: student-feedback
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.11

  # Cố định thư viện toán học để tránh lỗi DLL
  - mkl=2023.1.0
  - libblas=*=*mkl

  # PyTorch và các thư viện liên quan (Bản CPU)
  # Nếu sau này anh dùng GPU, thay 'cpuonly' bằng 'pytorch-cuda=12.1' và thêm channel 'nvidia'
  - pytorch>=2.2.0
  - torchvision
  - torchaudio
  - cpuonly

  # Thư viện phân tích dữ liệu
  - pandas>=2.0.0
  - numpy>=1.24.0
  - pyyaml>=6.0
  - scikit-learn>=1.4.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  # Các thư viện cài qua Pip
  - pip
  - pip:
      - gdown>=4.7.0
      - datasets>=2.14.0